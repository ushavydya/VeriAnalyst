[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verianalyst"
version = "0.1.0"
description = "Multi-agent SEC 10-K analysis pipeline: Retriever → Extractor → Critic → Writer"
requires-python = ">=3.11"
dependencies = [
  # LLM
  "anthropic>=0.40.0",
  # Orchestration
  "langgraph>=0.2.0",
  # Observability
  "langfuse>=2.0.0",
  # HTTP
  "httpx>=0.27.0",
  # Cache
  "aiosqlite>=0.20.0",
  # Config
  "python-dotenv>=1.0.0",
  # HTML parsing
  "beautifulsoup4>=4.12.0",
  # Web UI
  "streamlit>=1.35.0",
  "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
asyncio_mode = "auto"
